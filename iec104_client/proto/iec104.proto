syntax = "proto3";

// gRPC contract between the MSL5 backend and the external IEC 104 bridge
// service, connected over a Unix Domain Socket. The message below is a flat
// superset mirroring `Iec104Dto` / the `iec104` table (single-table
// inheritance of 104-IN and 104-OUT) field-for-field, so the backend adapter
// needs no per-direction mapping.
package msl5.iec104.v1;

enum Iec104Type {
  IEC104_TYPE_UNSPECIFIED = 0;
  IEC104_TYPE_IN = 1;
  IEC104_TYPE_OUT = 2;
}

message Iec104Point {
  // Present once the row has been saved on the backend side; the external
  // service echoes it back on every asynchronous frame so the backend can
  // correlate the frame to the row it belongs to.
  string id = 1;
  Iec104Type type = 2;
  string designation = 3;
  string channel_id = 4;
  string channel_name = 5;
  string asdu_typ = 6;
  int32 asdu_high = 7;
  int32 asdu_low = 8;
  int32 ioa_high = 9;
  int32 ioa_middle = 10;
  int32 ioa_low = 11;
  string typ = 12; // "Wert" | "Prozent"
  bool active = 13;
  // JSON-encoded free-form payload (mirrors Iec104Dto.payload); kept as a
  // string instead of google.protobuf.Struct to avoid an extra well-known-type
  // dependency for a field neither side interprets structurally.
  string payload_json = 14;
  int64 created_at = 15;
  int64 updated_at = 16;
  // 104-IN only
  string intervall = 17;
  int32 transmission_threshold = 18;
  // 104-OUT only
  string asdu_ret_typ = 19;
  int32 ioa_ret_high = 20;
  int32 ioa_ret_middle = 21;
  int32 ioa_ret_low = 22;
}

// Request to (re-)read/publish every point of one direction. Sent once per
// "Lesen" click; the backend does not wait for the external service's answer
// on this call — the answer(s) arrive later via SubscribeEvents.
message DispatchRequest {
  Iec104Type type = 1;
  repeated Iec104Point points = 2;
}

message DispatchAck {
  bool accepted = 1;
  string message = 2;
}

message SubscribeRequest {}

service Iec104Bridge {
  // Fire-and-forget from the backend's perspective: resolves once the
  // external service acknowledged receipt of the batch, not once it has
  // produced live values for every point.
  rpc Dispatch(DispatchRequest) returns (DispatchAck);

  // Long-lived server stream, opened once for the process lifetime. Every
  // asynchronous frame the external service produces (unsolicited or in
  // response to a Dispatch) arrives here and is persisted to DB + cache by
  // the backend as soon as it is received.
  rpc SubscribeEvents(SubscribeRequest) returns (stream Iec104Point);
}
